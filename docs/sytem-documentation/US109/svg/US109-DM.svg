fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="151" x="756.5" y="475.252">UNDER_MAINTENANCE</text><line style="stroke:#181818;stroke-width:0.5;" x1="751.5" x2="912.5" y1="482.3281" y2="482.3281"/></g><g id="elem_N1"><path d="M6,19.5 L6,193.0156 L320,193.0156 L320,29.5 L310,19.5 L6,19.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M310,19.5 L310,29.5 L320,29.5 L310,19.5 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="184" x="12" y="37.9951">AirportStatus is a Value Object.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293" x="12" y="54.3467">Updating the status = creating a new AirportStatus</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="205" x="12" y="70.6982">instance and assigning it to Airport.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="12" y="87.0498">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="255" x="12" y="103.4014">State transition model (pending OQ-109-01):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="268" x="12" y="119.7529">If constrained, Airport.changeStatus() enforces</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="207" x="12" y="136.1045">valid transitions in the domain layer.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="4" x="12" y="152.4561">&#160;</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="221" x="12" y="168.8076">Optimistic locking: Airport.version field</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="252" x="12" y="185.1592">prevents concurrent status-update conflicts.</text></g><g id="elem_N2"><path d="M355.5,77 L355.5,136.0547 L572.5,136.0547 L572.5,87 L562.5,77 L355.5,77 " fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M562.5,77 L562.5,87 L572.5,87 L562.5,77 " fill="#FEFFDD" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="361.5" y="95.4951">Confirmed (Conversation 002):</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="196" x="361.5" y="111.8467">Changing AirportStatus does NOT</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="173" x="361.5" y="128.1982">affect FlightRoute aggregates.</text></g><!--reverse link Airport to IATACode--><g id="link_Airport_IATACode"><path codeLine="23" d="M728.0803,180.9415 C714.1403,208.6715 703.61,229.61 691.61,253.48 " fill="none" id="Airport-backto-IATACode" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="733.47,170.22,727.2013,173.7842,728.0803,180.9415,734.349,177.3773,733.47,170.22" style="stroke:#181818;stroke-width:1.0;"/></g><!--reverse link Airport to AirportStatus--><g id="link_Airport_AirportStatus"><path codeLine="24" d="M792.0883,181.4875 C802.2483,209.2175 809.71,229.61 818.45,253.48 " fill="none" id="Airport-backto-AirportStatus" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="787.96,170.22,786.2683,177.2299,792.0883,181.4875,793.78,174.4777,787.96,170.22" style="stroke:#181818;stroke-width:1.0;"/></g><!--link AirportStatus to AirportState--><g id="link_AirportStatus_AirportState"><path codeLine="25" d="M832,329.85 C832,347.9 832,363.83 832,383.28 " fill="none" id="AirportStatus-to-AirportState" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="832,389.28,836,380.28,832,384.28,828,380.